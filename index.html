
<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183b2b">
<title>Coach Hub</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f3;color:#183b2b;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:16px 12px 60px}
header,.bar,.eventtop,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:24px;margin:0}
h2{font-size:20px}
button{border:0;border-radius:10px;background:#183b2b;color:white;padding:11px 13px;font:inherit;font-weight:650;cursor:pointer}
.alt{background:#e1e8e1;color:#183b2b}
.muted{color:#6b796f;font-size:13px}
.tabs{display:flex;background:#e1e8e1;border-radius:12px;padding:4px;max-width:340px;margin:18px auto}
.tabs button{flex:1;background:transparent;color:#183b2b}
.tabs .active{background:#183b2b;color:white}
.bar{margin:15px 0}
.bar h2{text-align:center;margin:0}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:white;padding:8px;border-radius:14px}
.weekday{text-align:center;color:#6b796f;font-size:12px;padding:8px 0}
.day{min-height:72px;text-align:left;padding:6px 4px;background:#f4f6f3;color:#183b2b;border:2px solid transparent}
.day.sel{border-color:#379366}
.day.today{background:#e0eee2}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#379366}
.dot.match{background:#e2a439}
.dot.analysis{background:#648bce}
.dot.meeting{background:#9b7ac7}
.week-scroll{overflow:auto;background:white;border-radius:14px;border:1px solid #e1e8e1}
.week-board{min-width:740px}
.week-head,.week-grid{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr))}
.week-head{position:sticky;top:0;background:white;z-index:2}
.week-head button{background:transparent;color:#183b2b;font-size:12px;padding:10px 1px;border-radius:0;border-left:1px solid #e1e8e1}
.week-grid{height:960px}
.hours,.daycol{position:relative}
.hour{position:absolute;right:4px;transform:translateY(-7px);font-size:11px;color:#64756a}
.daycol{border-left:1px solid #dfe7df;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#edf1ed 29px,#edf1ed 30px,transparent 30px,transparent 59px,#dce5dc 59px,#dce5dc 60px)}
.daycol.today{background-color:#f0faf2}
.block{position:absolute;left:2px;right:2px;overflow:hidden;padding:4px 3px;background:#ccebd4;color:#183b2b;border-left:4px solid #379366;border-radius:6px;text-align:left;font-size:11px;line-height:1.2;min-height:18px}
.block.match{background:#f9e4b4;border-color:#e2a439}
.block.analysis{background:#bfd7fa;border-color:#648bce}
.block.meeting{background:#e0cafa;border-color:#9b7ac7}
.block strong{display:block;overflow-wrap:anywhere}
.block span{font-size:10px}
article{background:#e5f3e8;border-left:5px solid #379366;border-radius:13px;padding:14px;margin:10px 0;cursor:pointer}
article.match{background:#f9e4b4;border-color:#e2a439}
article.analysis{background:#bfd7fa;border-color:#648bce}
article.meeting{background:#e0cafa;border-color:#9b7ac7}
article h3{margin:8px 0}
article p{margin:8px 0}
.timebox{display:flex;gap:5px}
.timebox div{background:#ffffffad;border-radius:8px;padding:5px 8px;text-align:center}
.timebox small{display:block;font-size:10px;color:#5f7165}
.timebox strong{font-size:17px}
section{margin-top:20px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.modal.open{display:flex}
form{background:white;padding:20px;border-radius:16px;width:100%;max-width:500px;max-height:92vh;overflow:auto}
label{display:block;margin:12px 0 5px;font-weight:650}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd6ce;border-radius:9px;font:inherit}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{margin-top:20px}
#delete{background:#a83b3b}
.panel{background:white;padding:18px;border-radius:15px;margin:14px 0}
.panel input{margin:8px 0}
.status{font-size:13px;color:#64756a;margin:8px 0}
.hidden,[hidden]{display:none!important}
a{color:#164b9b}
@media(max-width:420px){
.day{min-height:62px}
.month{gap:3px;padding:6px}
h1{font-size:22px}
}
</style>
</head>

<body>
<main>
<header>
<div>
<h1>⚽ Coach Hub</h1>
<div class="muted">Gemensam tränarkalender</div>
</div>
<button id="logout" class="alt hidden">Logga ut</button>
</header>

<div id="loginPanel" class="panel">
<h2>Logga in</h2>
<p>Logga in med den e-postadress som tränarstaben har bjudit in.</p>
<label for="email">E-postadress</label>
<input id="email" type="email" placeholder="namn@exempel.se">
<button id="sendLogin">Skicka inloggningslänk</button>
<p id="loginStatus" class="status"></p>
</div>

<div id="app" hidden>
<div class="bar">
<span id="syncStatus" class="muted">Ansluter…</span>
<button id="newEvent">+ Aktivitet</button>
</div>

<div class="tabs">
<button id="monthTab" class="active">Månad</button>
<button id="weekTab">Vecka</button>
</div>

<div class="bar">
<button id="prev" class="alt">‹</button>
<h2 id="period"></h2>
<button id="next" class="alt">›</button>
</div>

<div id="monthView" class="month"></div>

<div id="weekView" hidden>
<div class="week-scroll">
<div class="week-board">
<div class="week-head" id="weekHead"></div>
<div class="week-grid" id="weekGrid"></div>
</div>
</div>
<p class="muted">Svep i sidled för att se hela veckan. Tryck på ett block för att redigera.</p>
</div>

<section>
<h2 id="dateTitle"></h2>
<div id="activities"></div>
<button id="addBottom">+ Lägg till aktivitet</button>
</section>

<div class="panel" id="importPanel" hidden>
<h3>Flytta över dina tidigare aktiviteter</h3>
<p class="muted" id="importDescription"></p>
<button id="importButton">Importera till gemensam kalender</button>
<p id="importStatus" class="status"></p>
</div>
</div>
</main>

<div class="modal" id="modal">
<form id="form">
<h2 id="formTitle">Ny aktivitet</h2>
<label>Rubrik<input id="title" required></label>
<label>Datum<input id="date" type="date" required></label>
<div class="time-row">
<label>Starttid<input id="time" type="time" required></label>
<label>Sluttid<input id="endTime" type="time" required></label>
</div>
<label>Typ
<select id="type">
<option>Träning</option>
<option>Match</option>
<option>Matchanalys</option>
<option>Motståndaranalys</option>
<option>Träningsanalys</option>
<option>Möte</option>
<option>Övrigt</option>
</select>
</label>
<label>Plats<input id="place"></label>
<label>Anteckningar<textarea id="notes" rows="4"></textarea></label>
<label>Dokumentlänk<input id="link" type="url" placeholder="https://..."></label>
<div class="actions">
<button type="button" class="alt" id="cancel">Avbryt</button>
<button type="button" id="delete">Radera</button>
<button type="submit">Spara</button>
</div>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL='https://vrzgwqygzftzjwnhhdxt.supabase.co';
const SUPABASE_KEY='sb_publishable_xks7gBla4x8TVxbcr0Bnzw_h-USANI5';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const localKey='coachhub-calendar-v1';

let events=[],selected=localDate(new Date()),view=new Date(),mode='month',editing=null,user=null;
const weekdays=['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];

function localDate(d){
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function dateFrom(s){return new Date(s+'T12:00:00')}
function monday(d){const a=new Date(d);a.setDate(a.getDate()-(a.getDay()+6)%7);return a}
function addDays(d,n){const a=new Date(d);a.setDate(a.getDate()+n);return a}
function cat(t){return t==='Match'?'match':t==='Möte'?'meeting':(t||'').toLowerCase().includes('analys')?'analysis':''}
function min(t){const m=/^(\d\d?):(\d\d)$/.exec(t||'');return m?+m[1]*60 + +m[2]:null}
function end(e){
if(e.endTime)return e.endTime;
const n=min(e.time);
const v=(n??990)+90;
return String(Math.floor(v/60)%24).padStart(2,'0')+':'+String(v%60).padStart(2,'0')
}
function setStatus(s){$('syncStatus').textContent=s}

async function loadEvents(){
setStatus('Uppdaterar…');
const {data,error}=await db.from('coachhub_events').select('*').order('date',{ascending:true});
if(error){setStatus('Fel vid hämtning: '+error.message);return}
events=data||[];
setStatus('Gemensam kalender · uppdaterad');
render();
showImport()
}

async function startSession(){
if(!db){
$('loginStatus').textContent='Kunde inte ladda Supabase. Kontrollera internetanslutningen.';
return
}
const {data:{user:current}}=await db.auth.getUser();
user=current;
if(!user){
$('loginPanel').hidden=false;
$('app').hidden=true;
$('logout').classList.add('hidden');
return
}
const {data,error}=await db.from('coachhub_members').select('user_id').eq('user_id',user.id).maybeSingle();
if(error||!data){
$('loginPanel').hidden=false;
$('app').hidden=true;
$('loginStatus').textContent='Kontot är inloggat men ännu inte godkänt som medlem i Coach Hub.';
$('logout').classList.remove('hidden');
return
}
$('loginPanel').hidden=true;
$('app').hidden=false;
$('logout').classList.remove('hidden');
await loadEvents()
}

$('sendLogin').onclick=async()=>{
if(!db)return alert('Kunde inte ansluta till Supabase.');
const email=$('email').value.trim();
if(!email)return alert('Skriv din e-postadress.');
$('loginStatus').textContent='Skickar…';
const {error}=await db.auth.signInWithOtp({
email,
options:{
shouldCreateUser:false,
emailRedirectTo:location.origin+location.pathname
}
});
$('loginStatus').textContent=error?'Fel: '+error.message:'Kontrollera din e-post och öppna inloggningslänken på samma enhet.'
};

$('logout').onclick=async()=>{
await db.auth.signOut();
user=null;
events=[];
await startSession()
};

if(db){
db.auth.onAuthStateChange(()=>{setTimeout(startSession,0)});
startSession()
}

$('monthTab').onclick=()=>{mode='month';render()};
$('weekTab').onclick=()=>{mode='week';render()};
$('prev').onclick=()=>navigate(-1);
$('next').onclick=()=>navigate(1);

function navigate(n){
if(mode==='month'){
view=new Date(view.getFullYear(),view.getMonth()+n,1);
selected=localDate(view)
}else{
selected=localDate(addDays(dateFrom(selected),7*n));
view=dateFrom(selected)
}
render()
}

function chooseDate(d){
selected=d;
view=dateFrom(d);
render()
}

function render(){
$('monthTab').classList.toggle('active',mode==='month');
$('weekTab').classList.toggle('active',mode==='week');
$('monthView').hidden=mode!=='month';
$('weekView').hidden=mode!=='week';
if(mode==='month')renderMonth();
else renderWeek();
renderDetails()
}

function renderMonth(){
const y=view.getFullYear(),m=view.getMonth(),cal=$('monthView');
$('period').textContent=new Date(y,m,1).toLocaleDateString('sv-SE',{month:'long',year:'numeric'});
cal.replaceChildren();
weekdays.forEach(w=>{
const e=document.createElement('div');
e.className='weekday';
e.textContent=w;
cal.append(e)
});
for(let i=0;i<(new Date(y,m,1).getDay()+6)%7;i++)
cal.append(document.createElement('div'));
for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
const date=localDate(new Date(y,m,d)),b=document.createElement('button');
b.className='day'+(date===selected?' sel':'')+(date===localDate(new Date())?' today':'');
b.textContent=d;
const dots=document.createElement('div');
dots.className='dots';
events.filter(e=>e.date===date).forEach(e=>{
const dot=document.createElement('span');
dot.className='dot '+cat(e.type);
dots.append(dot)
});
b.append(dots);
b.onclick=()=>chooseDate(date);
cal.append(b)
}
}

function isoWeek(d){
const a=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
a.setUTCDate(a.getUTCDate()+4-(a.getUTCDay()||7));
const y=new Date(Date.UTC(a.getUTCFullYear(),0,1));
return Math.ceil((((a-y)/86400000)+1)/7)
}

function renderWeek(){
const start=monday(dateFrom(selected)),last=addDays(start,6);
$('period').textContent='Vecka '+isoWeek(dateFrom(selected))+' · '+start.toLocaleDateString('sv-SE',{day:'numeric',month:'short'})+'–'+last.toLocaleDateString('sv-SE',{day:'numeric',month:'short',year:'numeric'});
const head=$('weekHead'),grid=$('weekGrid');
head.replaceChildren();
grid.replaceChildren();
head.append(document.createElement('div'));
const hours=document.createElement('div');
hours.className='hours';
for(let h=7;h<=23;h++){
const el=document.createElement('div');
el.className='hour';
el.style.top=((h-7)*60)+'px';
el.textContent=String(h).padStart(2,'0')+':00';
hours.append(el)
}
grid.append(hours);

for(let i=0;i<7;i++){
const date=localDate(addDays(start,i)),b=document.createElement('button');
b.textContent=weekdays[i]+' '+dateFrom(date).getDate()+'/'+(dateFrom(date).getMonth()+1);
b.onclick=()=>chooseDate(date);
head.append(b);
const col=document.createElement('div');
col.className='daycol'+(date===localDate(new Date())?' today':'');
const occupied=[];

events.filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(e=>{
const st=min(e.time),en=min(end(e));
if(st===null||en===null||en<=420||st>=1380)return;
const a=Math.max(st,420),z=Math.min(en,1380),block=document.createElement('button');
block.className='block '+cat(e.type);
block.style.top=(a-420)+'px';
block.style.height=Math.max(18,z-a-2)+'px';
const t=document.createElement('span');
t.textContent=(e.time||'')+'–'+end(e);
const title=document.createElement('strong');
title.textContent=e.title;
block.append(t,title);
block.onclick=()=>{chooseDate(date);openForm(e.id)};
const conflicts=occupied.filter(o=>a<o.end&&z>o.start);
if(conflicts.length){
const width=100/(conflicts.length+1);
conflicts.forEach((o,j)=>{
o.el.style.left=(j*width)+'%';
o.el.style.width=width+'%';
o.el.style.right='auto'
});
block.style.left=(conflicts.length*width)+'%';
block.style.width=width+'%';
block.style.right='auto'
}
occupied.push({start:a,end:z,el:block});
col.append(block)
});
grid.append(col)
}
}

function renderDetails(){
$('dateTitle').textContent=dateFrom(selected).toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});
const list=$('activities');
list.replaceChildren();
const items=events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
if(!items.length){
const p=document.createElement('p');
p.textContent='Inget planerat den här dagen.';
list.append(p)
}
items.forEach(e=>{
const a=document.createElement('article');
a.className=cat(e.type);
const top=document.createElement('div');
top.className='eventtop';
const type=document.createElement('b');
type.textContent=e.type;
const times=document.createElement('div');
times.className='timebox';
[['Start',e.time],['Slut',e.endTime||'–']].forEach(([label,val])=>{
const box=document.createElement('div'),small=document.createElement('small'),strong=document.createElement('strong');
small.textContent=label;
strong.textContent=val;
box.append(small,strong);
times.append(box)
});
top.append(type,times);
const h=document.createElement('h3');
h.textContent=e.title;
a.append(top,h);
if(e.place){
const p=document.createElement('p');
p.textContent='📍 '+e.place;
a.append(p)
}
if(e.notes){
const p=document.createElement('p');
p.textContent=e.notes;
a.append(p)
}
if(e.link&&/^https?:\/\//i.test(e.link)){
const link=document.createElement('a');
link.href=e.link;
link.target='_blank';
link.rel='noopener noreferrer';
link.textContent='Öppna dokument';
a.append(link)
}
a.onclick=ev=>{if(ev.target.tagName!=='A')openForm(e.id)};
list.append(a)
})
}

function openForm(id){
const e=events.find(x=>x.id===id);
editing=e?.id||null;
$('form').reset();
['title','date','time','type','place','notes','link'].forEach(k=>$(k).value=e?.[k]||'');
$('date').value=e?.date||selected;
$('time').value=e?.time||'16:30';
$('endTime').value=e?end(e):'18:00';
$('formTitle').textContent=e?'Redigera aktivitet':'Ny aktivitet';
$('delete').hidden=!e;
$('modal').classList.add('open')
}

function closeForm(){$('modal').classList.remove('open')}
$('newEvent').onclick=()=>openForm();
$('addBottom').onclick=()=>openForm();
$('cancel').onclick=closeForm;

$('form').onsubmit=async ev=>{
ev.preventDefault();
if($('endTime').value<=$('time').value)
return alert('Sluttiden måste vara senare än starttiden.');
const e={
id:editing||crypto.randomUUID(),
created_by:editing?(events.find(x=>x.id===editing)?.created_by||user.id):user.id
};
['title','date','time','endTime','type','place','notes','link'].forEach(k=>e[k]=$(k).value);
const {error}=await db.from('coachhub_events').upsert(e);
if(error)return alert('Kunde inte spara: '+error.message);
selected=e.date;
view=dateFrom(e.date);
closeForm();
await loadEvents()
};

$('delete').onclick=async()=>{
if(!editing||!confirm('Radera aktiviteten för alla tränare?'))return;
const {error}=await db.from('coachhub_events').delete().eq('id',editing);
if(error)return alert('Kunde inte radera: '+error.message);
closeForm();
await loadEvents()
};

function showImport(){
let old=[];
try{old=JSON.parse(localStorage.getItem(localKey)||'[]')}catch{}
if(!Array.isArray(old))old=[];
const missing=old.filter(e=>e.id&&!events.some(x=>x.id===e.id));
$('importPanel').hidden=!missing.length;
$('importDescription').textContent=missing.length+' aktiviteter finns sparade lokalt på den här enheten men saknas i den gemensamma kalendern. Importera dem bara en gång.'
}

$('importButton').onclick=async()=>{
let old=[];
try{old=JSON.parse(localStorage.getItem(localKey)||'[]')}catch{}
if(!Array.isArray(old))return;
const missing=old.filter(e=>e.id&&!events.some(x=>x.id===e.id));
if(!missing.length)return showImport();
if(!confirm('Importera '+missing.length+' aktiviteter till den gemensamma kalendern?'))return;
let count=0;
for(const e of missing){
const payload={
id:String(e.id),
title:e.title||'Aktivitet',
date:e.date,
time:e.time||'16:30',
endTime:end(e),
type:e.type||'Övrigt',
place:e.place||'',
notes:e.notes||'',
link:e.link||'',
created_by:user.id
};
const {error}=await db.from('coachhub_events').upsert(payload,{onConflict:'id',ignoreDuplicates:true});
if(error){
$('importStatus').textContent='Importen avbröts efter '+count+' aktiviteter: '+error.message;
await loadEvents();
return
}
count++
}
$('importStatus').textContent=count+' aktiviteter importerade.';
await loadEvents()
};
</script>
</body>
</html>
