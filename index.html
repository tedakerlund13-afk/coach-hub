
<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173c2c">
<title>Coach Hub</title>

<style>
:root {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#183b2b;
  background:#f5f7f5;
}
* { box-sizing:border-box; }
body { margin:0; }
main { max-width:1350px;margin:auto;padding:15px 12px 70px; }
button,input,select,textarea { font:inherit; }
button {
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#194532;
  color:white;
  font-weight:700;
}
button:disabled { opacity:.5; }
.alt { background:#e6eee8;color:#183b2b; }
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:linear-gradient(125deg,#173c2c,#286b4d);
  color:white;
  border-radius:18px;
  padding:20px 22px;
  margin-bottom:17px;
}
header h1 { font-size:27px;margin:0 0 3px; }
header p { margin:0;color:#d9eadf;font-size:13px; }
header .alt {
  background:#ffffff22;
  color:white;
  border:1px solid #ffffff55;
}
.bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:15px 0;
}
.bar h2 { margin:0;text-align:center;font-size:19px; }
.muted { color:#66796d;font-size:13px; }
.tabs {
  display:flex;
  gap:5px;
  max-width:350px;
  background:#e6eee8;
  border-radius:12px;
  padding:5px;
  margin:14px auto;
}
.tabs button { flex:1;background:transparent;color:#183b2b; }
.tabs button.active {
  background:white;
  box-shadow:0 2px 8px #183b2b1a;
}
.month {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
  padding:7px;
  background:white;
  border:1px solid #dce7df;
  border-radius:14px;
}
.weekday { text-align:center;font-weight:700;font-size:11px;padding:7px 0; }
.day {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:5px;
  min-width:0;
  min-height:90px;
  background:#fafcfb;
  color:#183b2b;
  border:1px solid #e5ece7;
  border-radius:8px;
  padding:7px;
  text-align:left;
}
.day.today { background:#e8f5eb; }
.day.sel { outline:2px solid #2d805d; }
.dots { display:flex;flex-wrap:wrap;gap:3px; }
.dot { width:7px;height:7px;border-radius:50%;background:#379366; }
.dot.match { background:#e2a439; }
.dot.analysis { background:#648bce; }
.dot.meeting { background:#9b7ac7; }

.week-scroll {
  width:100%;
  overflow-x:auto;
  background:white;
  border:1px solid #e1e8e1;
  border-radius:14px;
}
.week-board { min-width:720px; }
.week-head,.week-grid {
  display:grid;
  grid-template-columns:49px repeat(7,minmax(0,1fr));
}
.week-head {
  background:white;
  position:sticky;
  top:0;
  z-index:2;
  border-bottom:1px solid #dce7df;
}
.week-head button {
  background:white;
  color:#183b2b;
  border-left:1px solid #e1e8e1;
  border-radius:0;
  font-size:11px;
  padding:8px 1px;
  min-width:0;
}
.week-head button.today { background:#e6f4e9; }
.week-grid { height:960px; }
.hours,.daycol { position:relative;min-width:0; }
.hour {
  position:absolute;
  right:3px;
  transform:translateY(-7px);
  font-size:10px;
  color:#718177;
}
.daycol {
  border-left:1px solid #dfe7df;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 29px,
    #edf1ed 29px,
    #edf1ed 30px,
    transparent 30px,
    transparent 59px,
    #dce5dc 59px,
    #dce5dc 60px
  );
}
.daycol.today { background-color:#eef8f0; }
.block {
  position:absolute;
  left:2px;
  right:2px;
  overflow:hidden;
  background:#ccebd4;
  color:#183b2b;
  border-left:3px solid #379366;
  border-radius:5px;
  text-align:left;
  padding:4px 3px;
  font-size:10px;
  line-height:1.15;
  min-height:18px;
  overflow-wrap:anywhere;
}
.block.match { background:#f9e4b4;border-color:#e2a439; }
.block.analysis { background:#bfd7fa;border-color:#648bce; }
.block.meeting { background:#e0cafa;border-color:#9b7ac7; }
.block strong { display:block;overflow-wrap:anywhere; }
.block span { font-size:9px; }

section { margin-top:23px; }
section h2 { font-size:20px;text-transform:capitalize; }
article {
  background:#e5f3e8;
  border-left:5px solid #379366;
  border-radius:12px;
  padding:13px;
  margin:10px 0;
  cursor:pointer;
}
article.match { background:#f9e4b4;border-color:#e2a439; }
article.analysis { background:#bfd7fa;border-color:#648bce; }
article.meeting { background:#e0cafa;border-color:#9b7ac7; }
article h3 { margin:9px 0; }
article p { margin:7px 0;white-space:pre-wrap; }
.eventtop {
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
}
.timebox { display:flex;gap:5px; }
.timebox div {
  background:#ffffffaa;
  border-radius:7px;
  padding:4px 6px;
  text-align:center;
}
.timebox small { display:block;font-size:9px; }
.timebox strong { font-size:13px; }
.panel {
  background:white;
  border:1px solid #e1e8e1;
  padding:18px;
  border-radius:15px;
  margin:14px 0;
}
.status { font-size:13px;color:#64756a; }
.hidden,[hidden] { display:none!important; }
.modal {
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:10;
}
.modal.open { display:flex; }
form {
  background:white;
  padding:19px;
  border-radius:15px;
  width:100%;
  max-width:500px;
  max-height:93vh;
  overflow:auto;
}
label { display:block;font-size:13px;font-weight:650;margin:11px 0 5px; }
input,select,textarea {
  width:100%;
  padding:11px;
  border:1px solid #ccd6ce;
  border-radius:9px;
  background:white;
  color:#183b2b;
  font-size:16px;
}
.time-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.actions { display:flex;gap:7px;margin-top:18px; }
.actions button { flex:1;padding:11px 5px; }
#delete { background:#a83b3b; }
a { color:#164b9b; }
summary { cursor:pointer;font-weight:700; }
#loginPanel { max-width:500px;margin:35px auto; }
#loginPanel button { width:100%;margin-top:15px; }

@media(min-width:950px) {
  .week-board { min-width:0; }
  .day { min-height:120px; }
}

/* Hela veckan synlig på telefon */
@media(max-width:700px) {
  main { padding:10px 7px 70px; }
  header { padding:17px 14px; }
  header h1 { font-size:23px; }
  .bar h2 { font-size:15px; }
  .bar button { padding:9px 11px; }
  .month { gap:2px;padding:4px; }
  .day { min-height:61px;padding:4px 2px;font-size:11px; }
  .weekday { font-size:10px; }
  .week-scroll { overflow-x:hidden; }
  .week-board { min-width:0;width:100%; }
  .week-head,.week-grid {
    grid-template-columns:27px repeat(7,minmax(0,1fr));
  }
  .week-head button {
    font-size:9px;
    line-height:1.2;
    padding:6px 0;
    min-height:39px;
    overflow-wrap:anywhere;
  }
  .hour { font-size:8px;right:1px; }
  .daycol { overflow:hidden; }
  .block {
    left:1px;
    right:1px;
    border-left-width:2px;
    border-radius:3px;
    padding:3px 1px;
    font-size:8px;
    line-height:1.15;
  }
  .block strong { font-size:8px; }
  .block span { display:none; }
  .timebox strong { font-size:12px; }
}
</style>
</head>

<body>
<main>
<header>
  <div>
    <h1>⚽ Coach Hub</h1>
    <p>Gemensam tränarkalender</p>
  </div>
  <button id="logout" class="alt hidden">Logga ut</button>
</header>

<div id="loginPanel" class="panel">
  <h2>Logga in</h2>
  <p>Logga in med ditt godkända tränarkonto.</p>
  <label for="email">E-postadress</label>
  <input id="email" type="email" autocomplete="email">
  <label for="password">Lösenord</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="sendLogin">Logga in</button>
  <p id="loginStatus" class="status"></p>
</div>

<div id="app" hidden>
  <div class="bar">
    <span id="syncStatus" class="muted">Ansluter…</span>
    <button id="newEvent">+ Aktivitet</button>
  </div>

  <div class="tabs">
    <button id="monthTab" class="active">Månad</button>
    <button id="weekTab">Vecka</button>
  </div>

  <div class="bar">
    <button id="prev" class="alt">‹</button>
    <h2 id="period"></h2>
    <button id="today" class="alt">Idag</button>
    <button id="next" class="alt">›</button>
  </div>

  <div id="monthView" class="month"></div>

  <div id="weekView" hidden>
    <div class="week-scroll">
      <div class="week-board">
        <div class="week-head" id="weekHead"></div>
        <div class="week-grid" id="weekGrid"></div>
      </div>
    </div>
  </div>

  <section>
    <h2 id="dateTitle"></h2>
    <div id="activities"></div>
    <button id="addBottom">+ Lägg till aktivitet</button>
  </section>

  <div class="panel" id="importPanel" hidden>
    <h3>Flytta över tidigare aktiviteter</h3>
    <p id="importDescription" class="muted"></p>
    <button id="importButton">Importera till gemensam kalender</button>
    <p id="importStatus" class="status"></p>
  </div>

  <details class="panel">
    <summary>Mitt konto – ändra lösenord</summary>
    <p id="accountEmail" class="muted"></p>
    <label>Nytt lösenord
      <input id="newPassword" type="password" minlength="12">
    </label>
    <label>Bekräfta lösenord
      <input id="confirmPassword" type="password" minlength="12">
    </label>
    <button id="savePassword">Spara lösenord</button>
    <p id="passwordStatus" class="status"></p>
  </details>
</div>
</main>

<div class="modal" id="modal">
  <form id="form">
    <h2 id="formTitle">Ny aktivitet</h2>
    <label>Rubrik<input id="title" required></label>
    <label>Datum<input id="date" type="date" required></label>
    <div class="time-row">
      <label>Starttid<input id="time" type="time" required></label>
      <label>Sluttid<input id="endTime" type="time" required></label>
    </div>
    <label>Typ
      <select id="type">
        <option>Träning</option>
        <option>Match</option>
        <option>Matchanalys</option>
        <option>Motståndaranalys</option>
        <option>Träningsanalys</option>
        <option>Möte</option>
        <option>Övrigt</option>
      </select>
    </label>
    <label>Plats<input id="place"></label>
    <label>Anteckningar<textarea id="notes" rows="4"></textarea></label>
    <label>Dokumentlänk<input id="link" type="url"></label>
    <div class="actions">
      <button type="button" class="alt" id="cancel">Avbryt</button>
      <button type="button" id="delete">Radera</button>
      <button type="submit" id="saveEvent">Spara</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const db = window.supabase?.createClient(
  'https://vrzgwqygzftzjwnhhdxt.supabase.co',
  'sb_publishable_xks7gBla4x8TVxbcr0Bnzw_h-USANI5'
);

const localKey = 'coachhub-calendar-v1';
let events = [];
let selected = localDate(new Date());
let view = new Date();
let mode = 'month';
let editing = null;
let user = null;
let sessionVersion = 0;

const weekdays = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];

function localDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function dateFrom(s) { return new Date(s+'T12:00:00'); }
function monday(d) {
  const a = new Date(d);
  a.setDate(a.getDate()-(a.getDay()+6)%7);
  return a;
}
function addDays(d,n) {
  const a = new Date(d);
  a.setDate(a.getDate()+n);
  return a;
}
function cat(t) {
  if(t==='Match') return 'match';
  if(t==='Möte') return 'meeting';
  if((t||'').toLowerCase().includes('analys')) return 'analysis';
  return '';
}
function min(t) {
  const m = /^(\d\d?):(\d\d)$/.exec(t||'');
  return m ? +m[1]*60 + +m[2] : null;
}
function end(e) {
  if(e.endTime) return e.endTime;
  const n = min(e.time);
  const v = (n??990)+90;
  return String(Math.floor(v/60)%24).padStart(2,'0')+
    ':'+String(v%60).padStart(2,'0');
}
function isoWeek(d) {
  const a = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  a.setUTCDate(a.getUTCDate()+4-(a.getUTCDay()||7));
  const y = new Date(Date.UTC(a.getUTCFullYear(),0,1));
  return Math.ceil((((a-y)/86400000)+1)/7);
}
function setStatus(s) {
  $('syncStatus').textContent=s;
}

async function loadEvents() {
  if(!user) return;
  setStatus('Uppdaterar…');
  const {data,error}=await db.from('coachhub_events')
    .select('*').order('date',{ascending:true});
  if(error) {
    setStatus('Fel vid hämtning: '+error.message);
    return;
  }
  events=data||[];
  setStatus('Gemensam kalender · uppdaterad');
  render();
  showImport();
}

async function startSession() {
  if(!db) {
    $('loginStatus').textContent='Kunde inte ansluta till Supabase.';
    return;
  }
  const version=++sessionVersion;
  const {data:{user:current},error:authError}=await db.auth.getUser();
  if(version!==sessionVersion) return;
  user=authError?null:current;
  if(!user) {
    $('loginPanel').hidden=false;
    $('app').hidden=true;
    $('logout').classList.add('hidden');
    return;
  }
  const {data,error}=await db.from('coachhub_members')
    .select('user_id').eq('user_id',user.id).maybeSingle();
  if(version!==sessionVersion) return;
  if(error||!data) {
    $('loginPanel').hidden=false;
    $('app').hidden=true;
    $('loginStatus').textContent='Kontot är inte godkänt som medlem.';
    $('logout').classList.remove('hidden');
    return;
  }
  $('loginPanel').hidden=true;
  $('app').hidden=false;
  $('logout').classList.remove('hidden');
  $('accountEmail').textContent='Inloggad som '+user.email;
  await loadEvents();
}

$('sendLogin').onclick=async()=>{
  if(!db) return alert('Kunde inte ansluta.');
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password) return alert('Ange e-post och lösenord.');
  $('sendLogin').disabled=true;
  $('loginStatus').textContent='Loggar in…';
  try {
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error) {
      $('loginStatus').textContent=error.message;
      return;
    }
    $('loginStatus').textContent='';
    $('password').value='';
    await startSession();
  } catch(err) {
    $('loginStatus').textContent=err.message;
  } finally {
    $('sendLogin').disabled=false;
  }
};

$('savePassword').onclick=async()=>{
  if(!db||!user) return;
  const password=$('newPassword').value;
  if(password.length<12) return alert('Minst 12 tecken krävs.');
  if(password!==$('confirmPassword').value)
    return alert('Lösenorden är inte likadana.');
  try {
    const {error}=await db.auth.updateUser({password});
    if(error) throw error;
    $('newPassword').value='';
    $('confirmPassword').value='';
    $('passwordStatus').textContent='Lösenordet är sparat.';
  } catch(err) {
    $('passwordStatus').textContent=err.message;
  }
};

$('logout').onclick=async()=>{
  await db.auth.signOut();
  user=null;
  events=[];
  await startSession();
};

if(db) {
  db.auth.onAuthStateChange(event=>{
    if(event==='SIGNED_IN'||event==='SIGNED_OUT')
      setTimeout(startSession,0);
  });
  startSession();
}

$('monthTab').onclick=()=>{mode='month';render();};
$('weekTab').onclick=()=>{mode='week';render();};
$('prev').onclick=()=>navigate(-1);
$('next').onclick=()=>navigate(1);
$('today').onclick=()=>{
  selected=localDate(new Date());
  view=new Date();
  render();
};

function navigate(n) {
  if(mode==='month') {
    view=new Date(view.getFullYear(),view.getMonth()+n,1);
    selected=localDate(view);
  } else {
    selected=localDate(addDays(dateFrom(selected),7*n));
    view=dateFrom(selected);
  }
  render();
}
function chooseDate(d) {
  selected=d;
  view=dateFrom(d);
  render();
}
function render() {
  $('monthTab').classList.toggle('active',mode==='month');
  $('weekTab').classList.toggle('active',mode==='week');
  $('monthView').hidden=mode!=='month';
  $('weekView').hidden=mode!=='week';
  if(mode==='month') renderMonth();
  else renderWeek();
  renderDetails();
}

function renderMonth() {
  const y=view.getFullYear(),m=view.getMonth(),cal=$('monthView');
  $('period').textContent=new Date(y,m,1)
    .toLocaleDateString('sv-SE',{month:'long',year:'numeric'});
  cal.replaceChildren();
  weekdays.forEach(w=>{
    const e=document.createElement('div');
    e.className='weekday';
    e.textContent=w;
    cal.append(e);
  });
  const offset=(new Date(y,m,1).getDay()+6)%7;
  for(let i=0;i<offset;i++) cal.append(document.createElement('div'));
  const days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++) {
    const date=localDate(new Date(y,m,d));
    const b=document.createElement('button');
    b.className='day'+
      (date===localDate(new Date())?' today':'')+
      (date===selected?' sel':'');
    const number=document.createElement('strong');
    number.textContent=d;
    const dots=document.createElement('div');
    dots.className='dots';
    events.filter(e=>e.date===date).slice(0,8).forEach(e=>{
      const dot=document.createElement('span');
      dot.className='dot '+cat(e.type);
      dots.append(dot);
    });
    b.append(number,dots);
    b.onclick=()=>chooseDate(date);
    cal.append(b);
  }
}

function renderWeek() {
  const start=monday(dateFrom(selected));
  const last=addDays(start,6);
  $('period').textContent='Vecka '+isoWeek(dateFrom(selected))+
    ' · '+start.toLocaleDateString('sv-SE',{day:'numeric',month:'short'})+
    '–'+last.toLocaleDateString('sv-SE',{day:'numeric',month:'short'});

  const head=$('weekHead'),grid=$('weekGrid');
  head.replaceChildren();
  grid.replaceChildren();
  head.append(document.createElement('div'));

  const hours=document.createElement('div');
  hours.className='hours';
  for(let h=7;h<=23;h++) {
    const el=document.createElement('div');
    el.className='hour';
    el.style.top=((h-7)*60)+'px';
    el.textContent=String(h).padStart(2,'0')+':00';
    hours.append(el);
  }
  grid.append(hours);

  for(let i=0;i<7;i++) {
    const date=localDate(addDays(start,i));
    const b=document.createElement('button');
    b.textContent=weekdays[i]+' '+dateFrom(date).getDate();
    if(date===localDate(new Date())) b.classList.add('today');
    b.onclick=()=>chooseDate(date);
    head.append(b);

    const col=document.createElement('div');
    col.className='daycol'+
      (date===localDate(new Date())?' today':'');

    const occupied=[];
    events.filter(e=>e.date===date)
      .sort((a,b)=>(a.time||'').localeCompare(b.time||''))
      .forEach(e=>{
        const st=min(e.time),en=min(end(e));
        if(st===null||en===null||en<=420||st>=1380) return;
        const a=Math.max(st,420),z=Math.min(en,1380);
        const block=document.createElement('button');
        block.className='block '+cat(e.type);
        block.style.top=(a-420)+'px';
        block.style.height=Math.max(18,z-a-2)+'px';

        const t=document.createElement('span');
        t.textContent=(e.time||'')+'–'+end(e);
        const title=document.createElement('strong');
        title.textContent=e.title;
        block.append(t,title);
        block.onclick=()=>{
          chooseDate(date);
          openForm(e.id);
        };

        const conflicts=occupied.filter(o=>a<o.end&&z>o.start);
        if(conflicts.length) {
          const width=100/(conflicts.length+1);
          conflicts.forEach((o,j)=>{
            o.el.style.left=(j*width)+'%';
            o.el.style.width=width+'%';
            o.el.style.right='auto';
          });
          block.style.left=(conflicts.length*width)+'%';
          block.style.width=width+'%';
          block.style.right='auto';
        }
        occupied.push({start:a,end:z,el:block});
        col.append(block);
      });
    grid.append(col);
  }
}

function renderDetails() {
  $('dateTitle').textContent=dateFrom(selected)
    .toLocaleDateString('sv-SE',{
      weekday:'long',day:'numeric',month:'long'
    });
  const list=$('activities');
  list.replaceChildren();
  const items=events.filter(e=>e.date===selected)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  if(!items.length) {
    const p=document.createElement('p');
    p.textContent='Inget planerat den här dagen.';
    list.append(p);
  }

  items.forEach(e=>{
    const a=document.createElement('article');
    a.className=cat(e.type);
    const top=document.createElement('div');
    top.className='eventtop';
    const type=document.createElement('b');
    type.textContent=e.type;
    const times=document.createElement('div');
    times.className='timebox';

    [['Start',e.time],['Slut',e.endTime||'–']].forEach(([label,val])=>{
      const box=document.createElement('div');
      const small=document.createElement('small');
      const strong=document.createElement('strong');
      small.textContent=label;
      strong.textContent=val;
      box.append(small,strong);
      times.append(box);
    });

    top.append(type,times);
    const h=document.createElement('h3');
    h.textContent=e.title;
    a.append(top,h);

    if(e.place) {
      const p=document.createElement('p');
      p.textContent='📍 '+e.place;
      a.append(p);
    }
    if(e.notes) {
      const p=document.createElement('p');
      p.textContent=e.notes;
      a.append(p);
    }
    if(e.link&&/^https?:\/\//i.test(e.link)) {
      const link=document.createElement('a');
      link.href=e.link;
      link.target='_blank';
      link.rel='noopener noreferrer';
      link.textContent='Öppna dokument';
      a.append(link);
    }
    a.onclick=ev=>{
      if(ev.target.tagName!=='A') openForm(e.id);
    };
    list.append(a);
  });
}

function openForm(id) {
  const e=events.find(x=>x.id===id);
  editing=e?.id||null;
  $('form').reset();
  ['title','date','time','type','place','notes','link'].forEach(k=>{
    $(k).value=e?.[k]||'';
  });
  $('date').value=e?.date||selected;
  $('time').value=e?.time||'16:30';
  $('endTime').value=e?end(e):'18:00';
  $('formTitle').textContent=e?'Redigera aktivitet':'Ny aktivitet';
  $('delete').hidden=!e;
  $('modal').classList.add('open');
}
function closeForm() {
  $('modal').classList.remove('open');
}

$('newEvent').onclick=()=>openForm();
$('addBottom').onclick=()=>openForm();
$('cancel').onclick=closeForm;

$('form').onsubmit=async ev=>{
  ev.preventDefault();
  if(!user) return;
  if($('endTime').value<=$('time').value)
    return alert('Sluttiden måste vara senare än starttiden.');

  const e={id:editing||crypto.randomUUID()};
  ['title','date','time','endTime','type','place','notes','link']
    .forEach(k=>{e[k]=$(k).value;});

  $('saveEvent').disabled=true;
  try {
    let result;
    if(editing) {
      result=await db.from('coachhub_events')
        .update(e).eq('id',editing);
    } else {
      e.created_by=user.id;
      result=await db.from('coachhub_events').insert(e);
    }
    if(result.error) {
      alert('Kunde inte spara: '+result.error.message);
      return;
    }
    selected=e.date;
    view=dateFrom(e.date);
    closeForm();
    await loadEvents();
  } catch(err) {
    alert('Fel: '+err.message);
  } finally {
    $('saveEvent').disabled=false;
  }
};

$('delete').onclick=async()=>{
  if(!editing||!user) return;
  if(!confirm('Radera aktiviteten för alla tränare?')) return;
  const {error}=await db.from('coachhub_events')
    .delete().eq('id',editing);
  if(error) return alert('Kunde inte radera: '+error.message);
  closeForm();
  await loadEvents();
};

function showImport() {
  let old=[];
  try {
    old=JSON.parse(localStorage.getItem(localKey)||'[]');
  } catch {}
  if(!Array.isArray(old)) old=[];
  const missing=old.filter(e=>e.id&&!events.some(x=>x.id===e.id));
  $('importPanel').hidden=!missing.length;
  $('importDescription').textContent=missing.length+
    ' aktiviteter finns lokalt på enheten men saknas i den gemensamma kalendern.';
}

$('importButton').onclick=async()=>{
  if(!user) return;
  let old=[];
  try {
    old=JSON.parse(localStorage.getItem(localKey)||'[]');
  } catch {}
  if(!Array.isArray(old)) return;
  const missing=old.filter(e=>e.id&&!events.some(x=>x.id===e.id));
  if(!missing.length) return;
  if(!confirm('Importera '+missing.length+' aktiviteter?')) return;

  $('importButton').disabled=true;
  let count=0;
  try {
    for(const e of missing) {
      const payload={
        id:String(e.id),
        title:e.title||'Aktivitet',
        date:e.date,
        time:e.time||'16:30',
        endTime:end(e),
        type:e.type||'Övrigt',
        place:e.place||'',
        notes:e.notes||'',
        link:e.link||'',
        created_by:user.id
      };
      const {error}=await db.from('coachhub_events')
        .upsert(payload,{onConflict:'id',ignoreDuplicates:true});
      if(error) {
        $('importStatus').textContent='Importfel: '+error.message;
        await loadEvents();
        return;
      }
      count++;
    }
    $('importStatus').textContent=count+' aktiviteter importerade.';
    await loadEvents();
  } finally {
    $('importButton').disabled=false;
  }
};

window.addEventListener('focus',()=>{
  if(user) loadEvents();
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&user) loadEvents();
});
setInterval(()=>{
  if(user&&!document.hidden) loadEvents();
},30000);

render();
</script>
</body>
</html>
